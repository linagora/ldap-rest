# Opts this repository in to the auto-js-pr bot (updates of vulnerable
# dependencies).
#
# The mocha suite needs Postgres, Valkey and an LDAP container (see the
# services of .github/workflows/test.yml), which the bot does not start: it
# only type-checks. `skipTests` says so: the pull request is a draft and the
# gap is reported.
skipTests: true
verifyCommands:
  - npm run check:ts
assignee: guimard
