name: LSC plugin

# test.yml and contracts.yml ignore these paths.
on:
  push:
    branches:
      - master
    paths:
      - 'lsc-plugin/**'
      - .github/workflows/lsc-plugin.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'lsc-plugin/**'
      - .github/workflows/lsc-plugin.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lsc-plugin-test:
    runs-on: ubuntu-latest
    name: LSC ldap-rest plugin (Java)
    env:
      LSC_CORE_TAG: v2.2
      # Bump when the tag moves without changing its name, or delete the
      # cache in the Actions page, to rebuild lsc-core from the new commit.
      LSC_CORE_CACHE_REVISION: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # lsc-core is not on Maven Central: build it once per tag and keep the
      # artifacts Maven installs under org/lsc. The local repository is
      # restored only on an exact key, so bumping the revision rebuilds it
      # rather than reusing the previous build.
      - name: Cache LSC core (${{ env.LSC_CORE_TAG }})
        id: lsc-core
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/lsc
          key: lsc-core-${{ env.LSC_CORE_TAG }}-${{ env.LSC_CORE_CACHE_REVISION }}

      - name: Build and install LSC core (${{ env.LSC_CORE_TAG }})
        if: steps.lsc-core.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LSC_CORE_TAG" https://github.com/lsc-project/lsc.git /tmp/lsc
          cd /tmp/lsc
          mvn -B -DskipTests install

      - name: Run plugin unit tests
        working-directory: lsc-plugin
        run: mvn -B test

      - name: Build shaded jar
        working-directory: lsc-plugin
        run: mvn -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lsc-ldaprest-plugin-jar
          path: lsc-plugin/target/lsc-ldaprest-plugin-*-with-deps.jar
          if-no-files-found: error
