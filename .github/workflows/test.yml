name: Test Node.js Module

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Every version reports its own verdict: the point here is to see
      # what Node 20 does, and fail-fast would cancel the others the moment
      # it stumbled.
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run rollup build to check typescript compilation
        run: npm run build

      # Nothing ran ESLint here, which is how fourteen errors accumulated
      # unnoticed. Warnings stay warnings: only errors fail the build.
      #
      # Neither of these reads the runtime, so one version answers for all
      # of them: running them across the matrix repeats the same work and,
      # worse, reports a dependency that did not install on an old Node as a
      # lint error about unresolved types.
      - name: Lint
        if: matrix.node-version == '24.x'
        run: npm run lint

      - name: Check formatting
        if: matrix.node-version == '24.x'
        run: npm run format:check

      # Runs the suite once and gates on coverage at the same time, rather
      # than running it twice. The threshold covers server code only: the
      # browser libraries have no DOM in the suite, so a global number would
      # mix two very different situations into one meaningless figure.
      - name: Run tests and check coverage
        run: npm run coverage:check

  lsc-plugin-test:
    runs-on: ubuntu-latest
    name: LSC ldap-rest plugin (Java)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # lsc-core is not on Maven Central — build it from the v2.2 tag and
      # install it into the local Maven repo.
      - name: Build and install LSC core (v2.2)
        run: |
          git clone --depth 1 --branch v2.2 https://github.com/lsc-project/lsc.git /tmp/lsc
          cd /tmp/lsc
          mvn -B -DskipTests install

      - name: Run plugin unit tests
        working-directory: lsc-plugin
        run: mvn -B test

      - name: Build shaded jar
        working-directory: lsc-plugin
        run: mvn -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsc-ldaprest-plugin-jar
          path: lsc-plugin/target/lsc-ldaprest-plugin-*-with-deps.jar
          if-no-files-found: error
