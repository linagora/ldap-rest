name: Test Node.js Module

# A change reaches `master` through a pull request, and a pull request is
# already tested: listening to every push as well ran the whole matrix twice
# for each one. The push trigger is kept for the default branch, so what
# lands there is tested as it lands.
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GitHub's dependency review judges what a pull request adds or changes
  # before a runner installs it. Its severity and allowlist are in
  # .github/dependency-review-config.yml.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml

  test:
    runs-on: ubuntu-latest

    strategy:
      # Each version answers for itself: one of them stumbling should report
      # that version, not cancel the verdict of the others.
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    # Docker Hub limits anonymous pulls per address, and the runners share
    # theirs: every test job failed at "Initialize containers" with
    # toomanyrequests. The images come from mirror.gcr.io, Google's public
    # cache of Docker Hub, which needs no credentials (a pull request from a
    # fork has none). The LDAP image the suite starts itself too, through
    # DM_TEST_LDAP_IMAGE below.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
      valkey:
        image: mirror.gcr.io/valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Reads the advisory database, not the Node version
      - name: Audit production dependencies
        if: matrix.node-version == '24.x'
        run: npm run audit:prod

      - name: Run rollup build to check typescript compilation
        run: npm run build

      # Nothing ran ESLint here, which is how fourteen errors accumulated
      # unnoticed. Warnings stay warnings: only errors fail the build.
      #
      # Neither of these reads the runtime, so one version answers for all
      # of them: running them across the matrix repeats the same work and,
      # worse, reports a dependency that did not install on an old Node as a
      # lint error about unresolved types.
      - name: Lint
        if: matrix.node-version == '24.x'
        run: npm run lint

      - name: Type-check with TypeScript 7
        if: matrix.node-version == '24.x'
        run: npm run check:ts7

      - name: Check formatting
        if: matrix.node-version == '24.x'
        run: npm run format:check

      - name: Check the hooks documented
        if: matrix.node-version == '24.x'
        run: npm run check:hooks

      # See docs/plugin-development/openapi.md
      - name: Check the OpenAPI document
        if: matrix.node-version == '24.x'
        run: npm run check:openapi

      # See docs/development/contracts.md
      - name: Check the options snapshot
        if: matrix.node-version == '24.x'
        run: npm run check:options

      # Runs the suite once and gates on coverage at the same time, rather
      # than running it twice. The threshold covers server code only: the
      # browser libraries have no DOM in the suite, so a global number would
      # mix two very different situations into one meaningless figure.
      - name: Run tests and check coverage
        run: npm run coverage:check
        env:
          DM_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          DM_TEST_VALKEY_URL: redis://localhost:6379
          DM_TEST_LDAP_IMAGE: mirror.gcr.io/osixia/openldap:1.5.0

  # A pull request shows what it does to the published contracts: the
  # snapshots committed on the base branch are compared with what the pull
  # request generates. See docs/development/contracts.md.
  contracts:
    runs-on: ubuntu-latest
    name: Published contracts
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compare the published contracts
        run: |
          git fetch origin "$BASE_REF"
          base=$(git merge-base HEAD "origin/$BASE_REF")
          if [ "$BREAKING" = 'true' ]; then
            npx tsx scripts/contracts.ts --base "$base" --breaking
          else
            npx tsx scripts/contracts.ts --base "$base"
          fi
        env:
          BASE_REF: ${{ github.base_ref }}
          BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'breaking') }}

  lsc-plugin-test:
    runs-on: ubuntu-latest
    name: LSC ldap-rest plugin (Java)
    env:
      LSC_CORE_TAG: v2.2
      # Bump when the tag moves without changing its name, or delete the
      # cache in the Actions page, to rebuild lsc-core from the new commit.
      LSC_CORE_CACHE_REVISION: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # lsc-core is not on Maven Central: build it once per tag and keep the
      # artifacts Maven installs under org/lsc. The local repository is
      # restored only on an exact key, so bumping the revision rebuilds it
      # rather than reusing the previous build.
      - name: Cache LSC core (${{ env.LSC_CORE_TAG }})
        id: lsc-core
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/lsc
          key: lsc-core-${{ env.LSC_CORE_TAG }}-${{ env.LSC_CORE_CACHE_REVISION }}

      - name: Build and install LSC core (${{ env.LSC_CORE_TAG }})
        if: steps.lsc-core.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LSC_CORE_TAG" https://github.com/lsc-project/lsc.git /tmp/lsc
          cd /tmp/lsc
          mvn -B -DskipTests install

      - name: Run plugin unit tests
        working-directory: lsc-plugin
        run: mvn -B test

      - name: Build shaded jar
        working-directory: lsc-plugin
        run: mvn -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: lsc-ldaprest-plugin-jar
          path: lsc-plugin/target/lsc-ldaprest-plugin-*-with-deps.jar
          if-no-files-found: error

  # What the release publishes, checked on every pull request: the chart
  # release.yml lints after the image is pushed, and the image it builds,
  # from the Dockerfile committed here.
  package:
    runs-on: ubuntu-latest
    name: Helm chart and Docker image
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The Dockerfile is generated from src and the build scripts, and the
      # image is built from what is committed: one that drifted builds the
      # previous commit. A diff here is fixed by committing what the
      # generator wrote in the runner, not by editing the Dockerfile.
      #
      # The generator is called rather than `npm run build:dockerfile`: that
      # goes through make, which rebuilds the Dockerfile only when a source
      # is newer, so a checkout that kept its dates would prove nothing.
      - name: Check the Dockerfile is up to date
        run: |
          npx tsx scripts/buildDockerfile.ts
          git diff --exit-code Dockerfile

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Lint the Helm chart
        run: helm lint helm/ldap-rest

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image to a local tar
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ldap-rest:ci
          cache-from: type=gha
          # The gha cache refuses a second write to a key it holds, which
          # every run of the same pull request after the first is
          cache-to: type=gha,mode=max,ignore-error=true

      # The image carries no LDAP settings, so the run gives them, pointing
      # at nothing. `/healthz` answering means the image starts with its
      # default plugins; `/readyz` answering 503 names the directory it
      # cannot reach, as a 200 would mean it reached something.
      - name: Run the image
        run: |
          trap 'docker logs --tail 40 ci || true; docker rm -f ci || true' EXIT
          docker run -d --name ci -p 8081:8081 \
            -e DM_LDAP_URL=ldap://127.0.0.1 \
            -e DM_LDAP_DN=cn=admin,dc=example,dc=com \
            -e DM_LDAP_PWD=admin \
            -e DM_LDAP_BASE=dc=example,dc=com \
            ldap-rest:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8081/healthz > /dev/null && break
            test "$(docker inspect -f '{{.State.Running}}' ci)" = true ||
              { echo 'The container stopped'; exit 1; }
            sleep 2
          done
          curl -fsS http://127.0.0.1:8081/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/readyz)" = 503
