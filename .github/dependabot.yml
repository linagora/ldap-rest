version: 2
updates:
  # Dependencies of the package, see CONTRIBUTING.md#dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
        patterns: ['*']
      development:
        dependency-type: development
        patterns: ['*']
    open-pull-requests-limit: 5

  # The Maven dependencies of lsc-plugin, including lsc-core
  - package-ecosystem: maven
    directory: /lsc-plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The base image of Dockerfile, generated by scripts/buildDockerfile.ts:
  # an update of it is made there
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
