version: 2
updates:
  # Dependencies of the package, see CONTRIBUTING.md#dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
        patterns: ['*']
      development:
        dependency-type: development
        patterns: ['*']
    open-pull-requests-limit: 5
    # `npm run check:ts7` loads TypeScript 7 through the `typescript7` alias,
    # see CONTRIBUTING.md#tests-and-checks: the `typescript` package stays on
    # the line the build and ESLint accept.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # The Maven dependencies of lsc-plugin, including lsc-core
  - package-ecosystem: maven
    directory: /lsc-plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The base image of Dockerfile, generated by scripts/buildDockerfile.ts:
  # an update of it is made there. Dependabot would edit the generated file
  # alone, which the drift check in test.yml refuses.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: 'node'
